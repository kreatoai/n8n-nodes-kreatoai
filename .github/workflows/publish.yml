# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── HOW IT WORKS ──────────────────────────────────────────────────────────────
#
# npm trusts this workflow (kreatoai/n8n-nodes-kreatoai, publish.yml) as a
# trusted publisher: no npm token is stored anywhere. The publisher may only
# stage versions, so each version waits in npmjs.com > Staged Packages until a
# maintainer approves it with 2FA.
#
# To release: bump "version" in package.json, add it to CHANGELOG.md, commit,
# then push a tag with the same number (e.g. 0.2.0).

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Update npm
        # Staged publishing needs npm 11.15.0 or later.
        run: 'npm install -g npm@^11.15.0'

      - name: Lint and build
        run: |
          npm run lint
          npm run build

      - name: Stage on npm
        # Authenticates with OIDC (trusted publisher, no token) and adds a
        # provenance attestation. The version is staged, not live: a maintainer
        # approves it with 2FA on npmjs.com (Staged Packages) to publish it.
        run: 'npm stage publish'
        env:
          RELEASE_MODE: 'true'
          NPM_CONFIG_PROVENANCE: 'true'
